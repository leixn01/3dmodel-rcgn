[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "3dmodel-rcgn"
version = "0.0.1"
description = "Evidence-aware CAD intake for industrial kinematics reconstruction"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cadkin = "cadkin.__main__:main"

[tool.setuptools.packages.find]
include = ["cadkin*"]
