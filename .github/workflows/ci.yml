name: project-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[solidworks]"
      - run: python -m unittest discover -s tests -v
      - name: Verify bundled test model
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import zipfile
          spec = json.loads(Path('configs/three_servo_lift.source.json').read_text(encoding='utf-8'))
          asset = Path(spec['local_archive'])
          assert asset.stat().st_size == spec['size_bytes'], 'Unexpected asset size'
          assert hashlib.sha256(asset.read_bytes()).hexdigest() == spec['sha256'], 'Asset hash mismatch'
          with zipfile.ZipFile(asset) as archive:
              assert archive.testzip() is None, 'ZIP CRC check failed'
              assert spec['step_member'] in archive.namelist(), 'STEP member missing'
              for item in spec['extracted_files']:
                  data = Path(item['path']).read_bytes()
                  assert len(data) == item['size_bytes'], item['path']
                  assert hashlib.sha256(data).hexdigest() == item['sha256'], item['path']
                  assert data == archive.read(item['member']), 'Extracted file differs from original ZIP'
          PY
