name: project-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: cadkin-ci
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          channel-priority: strict
          auto-activate-base: false
      - run: conda run --no-capture-output -n cadkin-ci python -m pip install -e ".[solidworks,templates]"
      - name: Verify cold stdio numeric runtime and batched chain workflow
        run: conda run --no-capture-output -n cadkin-ci python -m unittest tests.test_mcp.McpTests.test_local_constraint_solution_over_production_stdio tests.test_mcp.McpTests.test_batched_capture_and_chain_solution_over_stdio tests.test_mcp.McpTests.test_first_chain_baseline_over_production_stdio tests.test_mcp.McpTests.test_root_mates_without_cylinders_over_production_stdio tests.test_mcp.McpTests.test_geometry_analysis_capture_and_stop_over_stdio tests.test_mcp.McpTests.test_finite_boundaries_capture_index_and_stop_over_stdio tests.test_mcp.McpTests.test_surface_engagement_capture_index_and_stop_over_stdio tests.test_mcp.McpTests.test_planar_regions_capture_index_and_stop_over_stdio -v
      - run: conda run --no-capture-output -n cadkin-ci python -m unittest discover -s tests -v
      - run: conda run --no-capture-output -n cadkin-ci python scripts/verify_reference_templates.py --output outputs/ci-reference-0.13
      - run: conda run --no-capture-output -n cadkin-ci python scripts/verify_template_matching.py --output outputs/ci-matching-0.14
      - run: conda run --no-capture-output -n cadkin-ci python scripts/verify_rigid_drafts.py --output outputs/ci-rigid-0.15
      - run: conda run --no-capture-output -n cadkin-ci python scripts/verify_evidence_planning.py --output outputs/ci-planning-0.16
      - run: conda run --no-capture-output -n cadkin-ci python scripts/verify_evidence_execution.py --output outputs/ci-execution-0.17
      - run: conda run --no-capture-output -n cadkin-ci python scripts/verify_observation_reuse.py --output outputs/ci-observation-0.18
      - run: conda run --no-capture-output -n cadkin-ci python scripts/verify_face_planning.py --output outputs/ci-face-planning-0.19
      - run: conda run --no-capture-output -n cadkin-ci python scripts/verify_face_reintegration.py --output outputs/ci-face-reintegration-0.20
      - run: conda run --no-capture-output -n cadkin-ci python scripts/verify_target_evidence.py --output outputs/ci-target-evidence-0.21
      - run: conda run --no-capture-output -n cadkin-ci python scripts/verify_constraint_analysis.py --output outputs/ci-constraint-analysis-0.22
      - run: conda run --no-capture-output -n cadkin-ci python scripts/verify_constraint_followup.py --output outputs/ci-constraint-followup-0.23
      - run: conda run --no-capture-output -n cadkin-ci python scripts/verify_local_constraints.py --output outputs/ci-local-constraints-0.24
      - run: conda run --no-capture-output -n cadkin-ci python scripts/verify_chain_constraints.py --output outputs/ci-chain-constraints-0.25
      - run: conda run --no-capture-output -n cadkin-ci python scripts/verify_mcp_efficiency.py --output outputs/ci-mcp-efficiency-0.25
      - run: conda run --no-capture-output -n cadkin-ci python scripts/verify_chain_session.py --output outputs/ci-chain-session-0.26
      - run: conda run --no-capture-output -n cadkin-ci python scripts/verify_root_mates.py --output outputs/ci-root-mates-0.27
      - run: conda run --no-capture-output -n cadkin-ci python scripts/verify_geometric_connections.py --output outputs/ci-geometric-connections-0.28
      - run: conda run --no-capture-output -n cadkin-ci python scripts/verify_finite_connections.py --output outputs/ci-finite-connections-0.29
      - run: conda run --no-capture-output -n cadkin-ci python scripts/verify_surface_engagement.py --output outputs/ci-surface-engagement-0.30
      - run: conda run --no-capture-output -n cadkin-ci python scripts/verify_planar_contacts.py --output outputs/ci-planar-contacts-0.31
      - name: Verify bundled test model
        shell: pwsh
        run: |
          @'
          import os
          import sys
          import hashlib
          import json
          from pathlib import Path
          assert os.path.normcase(os.path.abspath(sys.prefix)) == os.path.normcase(os.path.abspath(os.environ['CONDA_PREFIX']))
          print('Conda Python:', sys.executable)
          spec = json.loads(Path('configs/three_servo_lift.source.json').read_text(encoding='utf-8'))
          assert spec['local_step'] in [item['path'] for item in spec['bundled_files']]
          for item in spec['bundled_files']:
              data = Path(item['path']).read_bytes()
              assert len(data) == item['size_bytes'], item['path']
              assert hashlib.sha256(data).hexdigest() == item['sha256'], item['path']
          '@ | conda run --no-capture-output -n cadkin-ci python -
