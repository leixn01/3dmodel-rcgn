name: project-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[solidworks]"
      - run: python -m unittest discover -s tests -v
      - name: Verify bundled test model
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          spec = json.loads(Path('configs/three_servo_lift.source.json').read_text(encoding='utf-8'))
          assert spec['local_step'] in [item['path'] for item in spec['bundled_files']]
          for item in spec['bundled_files']:
              data = Path(item['path']).read_bytes()
              assert len(data) == item['size_bytes'], item['path']
              assert hashlib.sha256(data).hexdigest() == item['sha256'], item['path']
          PY
